name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # CPU wheels of torch: the tests run a tiny randomly initialised model, no GPU and no download
      - run: uv venv -p ${{ matrix.python }} && uv pip install torch --index-url https://download.pytorch.org/whl/cpu && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests && uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest -q
  bare-install:
    # the package as `pip install yhatmodels` gives it: no matplotlib (the plot tests skip themselves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv -p 3.11 && uv pip install torch --index-url https://download.pytorch.org/whl/cpu && uv pip install -e . pytest
      - run: uv run --no-sync pytest -q
